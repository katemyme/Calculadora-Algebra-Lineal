[pytest]
# Desde backend/:  python -m pytest
# Recoge TODAS las pruebas del proyecto: las de unittest (Programas 2–6), las funciones
# probar_* del Programa 5 y las pruebas en estilo pytest del Programa 7.
testpaths = pruebas
python_files = pruebas_*.py
python_functions = test_* probar_*
pythonpath = . programa_4
filterwarnings =
    ignore::DeprecationWarning
